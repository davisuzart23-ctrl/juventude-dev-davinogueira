<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de produto</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="inicio" class="site-header">
    <div class="container header-content">
      <a class="brand" href="#inicio">Minha Loja</a>
      <nav class="main-menu" aria-label="Menu principal">
        <a href="#inicio">Início</a>
        <a href="#cadastro-produto">Cadastro de produto</a>
        <a href="#opcoes">Opções</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <section id="cadastro-produto" class="form-card" aria-labelledby="page-title">
      <div class="form-heading">
        <p class="eyebrow">PRODUTOS</p>
        <h1 id="page-title">Cadastro de produto</h1>
        <p>Preencha as informações para cadastrar um produto na loja.</p>
      </div>

      <form>
        <div class="mb-3">
          <label for="nome" class="form-label">Nome do produto</label>
          <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            maxlength="100"
            placeholder="Ex.: Fone de ouvido"
            required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-sm-6">
            <label for="preco" class="form-label">Preço</label>
            <div class="input-group">
              <span class="input-group-text">R$</span>
              <input
                type="number"
                class="form-control"
                id="preco"
                name="preco"
                min="0.01"
                step="0.01"
                placeholder="0,00"
                required>
            </div>
          </div>
          <div class="col-12 col-sm-6">
            <label for="estoque" class="form-label">Quantidade em estoque</label>
            <input
              type="number"
              class="form-control"
              id="estoque"
              name="estoque"
              min="0"
              step="1"
              placeholder="Ex.: 10"
              required>
          </div>
        </div>

        <div class="mb-3">
          <label for="categoria" class="form-label">Categoria</label>
          <select class="form-select" id="categoria" name="categoria" required>
            <option value="" selected disabled>Selecione uma categoria</option>
            <option value="casa">Casa</option>
            <option value="esporte">Esporte</option>
            <option value="livros">Livros</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea
            class="form-control"
            id="descricao"
            name="descricao"
            rows="4"
            maxlength="300"
            placeholder="Escreva uma descrição para o produto (opcional)"></textarea>
        </div>

        <fieldset id="opcoes" class="options-section mb-4">
          <legend class="form-label">Opções do produto</legend>
          <div class="row g-3">
            <div class="col-12 col-sm-4">
              <label class="option-card">
                <input type="checkbox" name="ativo" value="sim" checked>
                <span class="option-card-content">
                  <span class="option-symbol" aria-hidden="true">✓</span>
                  <span class="option-name">Ativo</span>
                  <span class="option-description">Disponível na loja</span>
                </span>
              </label>
            </div>
            <div class="col-12 col-sm-4">
              <label class="option-card">
                <input type="checkbox" name="destaque" value="sim">
                <span class="option-card-content">
                  <span class="option-symbol" aria-hidden="true">★</span>
                  <span class="option-name">Destaque</span>
                  <span class="option-description">Dar mais visibilidade</span>
                </span>
              </label>
            </div>
            <div class="col-12 col-sm-4">
              <label class="option-card">
                <input type="checkbox" name="frete-gratis" value="sim">
                <span class="option-card-content">
                  <span class="option-symbol" aria-hidden="true">↗</span>
                  <span class="option-name">Frete grátis</span>
                  <span class="option-description">Entrega sem custo</span>
                </span>
              </label>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="reset" class="btn btn-light">Limpar</button>
          <button type="submit" class="btn btn-primary">Cadastrar produto</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
